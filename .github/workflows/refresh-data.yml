# Save as .github/workflows/refresh-data.yml  (Settings > Actions > General > Workflow permissions: Read and write)
name: Refresh Conviction data
on:
  schedule:
    - cron: '30 13 * * 1-5'   # 19:00 IST weekdays, after NSE bhavcopy is published
  workflow_dispatch:            # "Run workflow" button for the first run or any manual refresh
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install yfinance pandas requests
      - run: python update_data.py
      - run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fundamentals.json prices.json data_status.json
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%F)"
          git push
